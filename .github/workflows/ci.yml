name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ashes
          POSTGRES_PASSWORD: ashes
          POSTGRES_DB: ashes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ashes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ashes:ashes@localhost:5432/ashes
      TEST_DATABASE_URL: postgres://ashes:ashes@localhost:5432/ashes
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

      - name: Unit + API + Postgres integration tests
        run: pnpm run test
        env:
          DATABASE_URL: postgres://ashes:ashes@localhost:5432/ashes
          TEST_DATABASE_URL: postgres://ashes:ashes@localhost:5432/ashes

      - name: Production build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: postgres://ashes:ashes@localhost:5432/ashes

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
