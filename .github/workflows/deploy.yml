name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @ashes/web build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages deploys from GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAGE_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          BUILD_TYPE=$(echo "$PAGE_JSON" | jq -r '.build_type // empty')
          if [ "$BUILD_TYPE" != "workflow" ]; then
            echo "::error::GitHub Pages is not set to deploy from GitHub Actions (build_type='${BUILD_TYPE:-unset}'). Open Settings → Pages → 'Build and deployment' → Source: select 'GitHub Actions' → Save, then re-run this workflow."
            exit 1
          fi
          echo "Pages source OK (build_type=workflow)."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
