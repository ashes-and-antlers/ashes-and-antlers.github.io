# Local development database (M1: PostgreSQL persistence).
# Start with `docker compose up -d`, stop with `docker compose down`.
# Credentials match the default DATABASE_URL in apps/api/src/server.ts.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ashes-postgres
    environment:
      POSTGRES_USER: ashes
      POSTGRES_PASSWORD: ashes
      POSTGRES_DB: ashes
    ports:
      - '5432:5432'
    volumes:
      - ashes-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ashes']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ashes-pgdata:
